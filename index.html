<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Webpage</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #e2e8f0; }
    
    .container { max-width: 1000px; margin: 0 auto; }

    /* HEADER NAVY */
    .header { background: #1e293b; padding: 25px 20px 0; text-align: center; border-bottom: 2px solid #334155; }
    .logo img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 4px solid #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,0.4); }
    
    .menu { margin-top: 20px; }
    .menu ul { list-style: none; display: flex; justify-content: center; gap: 10px; }
    .menu ul li { position: relative; }
    .menu ul li a { display: block; padding: 12px 25px; color: #fff; text-decoration: none; font-weight: 600; border-radius: 10px; transition: 0.3s; }
    .menu ul li a:hover { background: #38bdf8; color: #0f172a; }

    .submenu { display: none !important; position: absolute; top: 100%; left: 0; background: #1e293b; min-width: 160px; border: 1px solid #334155; border-radius: 10px; overflow: hidden; z-index: 10; }
    .menu ul li:hover .submenu { display: block !important; }
    .submenu li { display: block; }
    .submenu li a { border-radius: 0; text-align: left; padding: 10px 15px !important; }
    
    /* JUMBOTRON NAVY + BACKGROUND GAMBAR */
    .jumbotron { 
        padding: 90px 30px;
        text-align: center;
        color: white;
        background-image: linear-gradient(rgba(15,23,42,0.7), rgba(15,23,42,0.7)), url('kaos pendek.jpg');
        background-size: cover;
        background-position: center;
        border-bottom: 3px solid #38bdf8;
    }
    .jumbotron h2 { font-size: 36px; margin-bottom: 15px; color: #fff; }
    .jumbotron p { max-width: 700px; margin: 0 auto; line-height: 1.6; color: #cbd5e1; }

    /* CONTENT */
    .content { padding: 40px 20px; text-align: center; background: #0f172a; }
    .content > h2 { font-size: 28px; margin-bottom: 30px; color: #38bdf8; }
    
    .product-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }

    .thumbnail { 
        background: #1e293b; 
        border: 1px solid #334155;
        width: 270px; 
        padding: 15px; 
        border-radius: 15px;
        transition: 0.3s;
    }
    .thumbnail:hover { transform: translateY(-6px); border-color: #38bdf8; box-shadow: 0 10px 25px rgba(56,189,248,0.25); }
    .thumbnail img { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; }
    .thumbnail h2 { margin: 12px 0 5px; font-size: 18px; color: #fff; }
    .thumbnail p { color: #38bdf8; font-weight: bold; font-size: 18px; }

    /* FOOTER */
    .footer { background: #020617; padding: 20px; text-align: center; color: #94a3b8; border-top: 2px solid #1e293b; margin-top: 40px; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <img src="logo.png.jpeg" alt="logo">
        </div>
        <div class="menu">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a>
                    <ul class="submenu">
                        <li><a href="#">CV</a></li>
                        <li><a href="#">Education</a></li>
                        <li><a href="#">Portfolio</a></li>
                    </ul>
                </li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </div>

    <div class="jumbotron">
        <h2>Welcome to My Homepage</h2>
        <p>Selamat Datang Di Toko UPI, Koleksi Kaos Sablon.</p>
    </div>

    <div class="content">
        <h2>My Articles - Sablon Baju</h2>
        <div class="product-grid">
            <div class="thumbnail">
                <img src="baju.jpg" alt="baju">
                <h2>Kaos Abu</h2>
                <p>Rp 250.000</p>
            </div>
            <div class="thumbnail">
                <img src="sablon.jpg" alt="sablon">
                <h2>Kaos Hitam</h2>
                <p>Rp 250.000</p>
            </div>
            <div class="thumbnail">
                <img src="kaos.jpg" alt="kaos">
                <h2>Kaos Creem</h2>
                <p>Rp 250.000</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>2026 my page</p>
    </div>
</div>

</body>
</html>
